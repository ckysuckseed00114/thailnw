<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootMarch Enhanced · Standalone Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <div class="ui-layer">
      <header class="top-hud">
        <div style="width:260px"></div>
        <div class="center-banner-group">
          <div class="zone-header">
            <div class="sub">✦ THE DUNGEON ✦</div>
            <div class="title" id="zone-title">Obsidian Sanctum</div>
            <div class="room-num" id="zone-room-num">Floor 4 · Room 3/8</div>
          </div>
        </div>
        <div class="currency-bar interactive">
          <div class="curr-item lm"><span>🪙</span><span id="lm-balance">0</span></div>
          <div class="curr-item bone"><span>🦴</span><span id="bone-balance">0</span></div>
        </div>
      </header>
      <div class="left-widgets interactive">
        <div class="card hero-profile">
          <div class="hero-avatar">🛡️</div>
          <div class="hero-details">
            <div class="hero-name-row"><span class="hero-name">LuckyRohit</span><span class="hero-lvl" id="hero-level-text">Lv. 1</span></div>
            <div class="hp-bar-wrap"><div class="hp-fill" id="hero-hp-fill"></div></div>
            <div class="hp-text"><span>❤️ HP</span><span id="hero-hp-text">100 / 100</span></div>
            <div class="xp-bar-wrap"><div class="xp-fill" id="hero-xp-fill"></div></div>
          </div>
        </div>
      </div>
      <footer class="bottom-dock">
        <div class="skill-slot-wrap interactive">
          <div class="skill-btn" id="skill-btn" onclick="window.dungeonCanvas.triggerCleaveSkill()" title="Space = Cleave">
            <div class="icon">🪓</div>
            <div class="name">Cleave</div>
            <div class="cd-overlay" id="skill-cd"></div>
          </div>
        </div>
        <nav class="menu-buttons interactive">
          <button class="m-btn" onclick="openModal('inventory-modal')">Inventory</button>
          <button class="m-btn" onclick="openModal('stats-modal')">Stats</button>
          <button class="m-btn" onclick="openModal('pet-modal')">Pet</button>
          <button class="m-btn loot-chest" id="loot-chest-btn" onclick="openModal('loot-modal')">Loot <span class="badge" id="loot-badge" style="display:none">0</span></button>
        </nav>
      </footer>
    </div>
    <div class="modal-overlay" id="inventory-modal"><div class="modal-box"><div class="modal-header"><h2>Inventory</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div><div class="modal-body"><button class="btn-primary" onclick="equipBest()">Equip Best</button></div></div></div>
    <div class="modal-overlay" id="stats-modal"><div class="modal-box"><div class="modal-header"><h2>Stats</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div><div class="modal-body"><p>Demo attributes — main game uses Embermarch core.</p></div></div></div>
    <div class="modal-overlay" id="pet-modal"><div class="modal-box"><div class="modal-header"><h2>Pet</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div><div class="modal-body"><button class="btn-primary" onclick="feedPet()">Feed</button></div></div></div>
    <div class="modal-overlay" id="shop-modal"><div class="modal-box"><div class="modal-header"><h2>Shop</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div></div></div>
    <div class="modal-overlay" id="travel-modal"><div class="modal-box"><div class="modal-header"><h2>Travel</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div></div></div>
    <div class="modal-overlay" id="quests-modal"><div class="modal-box"><div class="modal-header"><h2>Quests</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div></div></div>
    <div class="modal-overlay" id="loot-modal"><div class="modal-box"><div class="modal-header"><h2>Loot</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div><div class="modal-body"><button class="btn-primary" onclick="claimLoot()">Claim all</button></div></div></div>
    <div class="modal-overlay" id="chat-modal"><div class="modal-box"><div class="modal-header"><h2>Chat</h2><button class="modal-close" onclick="closeAllModals()">✕</button></div></div></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
